<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 36" width="1280" height="36" role="img" aria-label="divider">
  <defs>
    <linearGradient id="l" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity=".6"/><stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity=".6"/><stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .in-fade { animation: inFade .9s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inFade { from { opacity: 0 } }
      .in-up { animation: inUp .9s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inUp { from { opacity: 0; transform: translateY(14px) } }
      .in-left { animation: inLeft 1s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inLeft { from { opacity: 0; transform: translateX(-26px) } }
      .in-pop { animation: inPop .7s cubic-bezier(.34,1.56,.64,1) backwards; transform-box: fill-box; transform-origin: center; }
      @keyframes inPop { from { opacity: 0; transform: scale(0) } }
      .in-wipe { animation: inWipe 1.2s cubic-bezier(.16,1,.3,1) backwards; transform-box: fill-box; transform-origin: 0 50%; }
      @keyframes inWipe { from { transform: scaleX(0) } }
      .in-wipe-c { animation: inWipe 1.2s cubic-bezier(.16,1,.3,1) backwards; transform-box: fill-box; transform-origin: center; }
      .in-draw { stroke-dasharray: 1; animation: inDraw 1.4s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inDraw { from { stroke-dashoffset: 1 } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before { animation: none !important; }
        .smil { display: none; }
        .rm-show { display: inline !important; }
      }
      .out-l { animation: outL 3.6s cubic-bezier(.4,0,.2,1) infinite; }
      .out-r { animation: outR 3.6s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes outL { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: 1 } 100% { transform: translateX(-560px); opacity: 0 } }
      @keyframes outR { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: 1 } 100% { transform: translateX(560px); opacity: 0 } }
      .spin { transform-box: view-box; animation: spin 8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
    ]]></style>
  </defs>
  <rect x="40" y="17.5" width="580.0" height="1" fill="url(#l)"/>
  <rect x="660.0" y="17.5" width="580.0" height="1" fill="url(#r)"/>
  <g class="spin" style="transform-origin:640.0px 18px"><rect x="634.0" y="12" width="12" height="12" fill="none" stroke="#F59E0B" stroke-width="1.3"/></g>
  <circle cx="640.0" cy="18" r="2" fill="#FBBF24"/>
  <circle class="out-l" style="animation-delay:0.0s" cx="618.0" cy="18" r="1.8" fill="#93C5FD"/>
  <circle class="out-r" style="animation-delay:0.0s" cx="662.0" cy="18" r="1.8" fill="#93C5FD"/>
  <circle class="out-l" style="animation-delay:1.2s" cx="618.0" cy="18" r="1.8" fill="#93C5FD"/>
  <circle class="out-r" style="animation-delay:1.2s" cx="662.0" cy="18" r="1.8" fill="#93C5FD"/>
  <circle class="out-l" style="animation-delay:2.4s" cx="618.0" cy="18" r="1.8" fill="#93C5FD"/>
  <circle class="out-r" style="animation-delay:2.4s" cx="662.0" cy="18" r="1.8" fill="#93C5FD"/>
</svg>
