<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Three layers: orchestration, retrieval, verification">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171730"/>
      <stop offset="100%" stop-color="#101024"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#60A5FA" stroke-width="0.5" opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity=".28"/><stop offset="100%" stop-color="#F59E0B" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="bandClip"><rect x="860" y="0" width="0" height="300">
      <animate attributeName="width" dur="5s" repeatCount="indefinite" keyTimes="0;.45;.85;1" values="0;400;400;400" calcMode="spline" keySplines=".16 1 .3 1;0 0 1 1;0 0 1 1"/>
    </rect></clipPath>
    <style><![CDATA[
      .in-fade { animation: inFade .9s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inFade { from { opacity: 0 } }
      .in-up { animation: inUp .9s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inUp { from { opacity: 0; transform: translateY(14px) } }
      .in-left { animation: inLeft 1s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inLeft { from { opacity: 0; transform: translateX(-26px) } }
      .in-pop { animation: inPop .7s cubic-bezier(.34,1.56,.64,1) backwards; transform-box: fill-box; transform-origin: center; }
      @keyframes inPop { from { opacity: 0; transform: scale(0) } }
      .in-wipe { animation: inWipe 1.2s cubic-bezier(.16,1,.3,1) backwards; transform-box: fill-box; transform-origin: 0 50%; }
      @keyframes inWipe { from { transform: scaleX(0) } }
      .in-wipe-c { animation: inWipe 1.2s cubic-bezier(.16,1,.3,1) backwards; transform-box: fill-box; transform-origin: center; }
      .in-draw { stroke-dasharray: 1; animation: inDraw 1.4s cubic-bezier(.16,1,.3,1) backwards; }
      @keyframes inDraw { from { stroke-dashoffset: 1 } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before { animation: none !important; }
        .smil { display: none; }
        .rm-show { display: inline !important; }
      }
      .ring-spin { transform-box: view-box; animation: spin 24s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20 } }
      .twinkle { animation: tw 3.2s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .35 } 50% { opacity: .85 } }
      .sonar { transform-box: fill-box; transform-origin: center; animation: sonar 3s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes sonar { 0% { transform: scale(.2); opacity: .9 } 100% { transform: scale(1); opacity: 0 } }
      .nn { animation: nn 3s ease-in-out infinite; }
      @keyframes nn { 0%,15% { opacity: 0 } 30%,80% { opacity: 1 } 100% { opacity: 0 } }
      .nnline { stroke-dasharray: 1; animation: nnline 3s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes nnline { 0%,15% { stroke-dashoffset: 1; opacity: 1 } 45%,80% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
      .curve { stroke-dasharray: 1; animation: curve 5s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes curve { 0% { stroke-dashoffset: 1; opacity: 1 } 45%,85% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
      .check { stroke-dasharray: 1; animation: check 5s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes check { 0%,45% { stroke-dashoffset: 1; opacity: 1 } 60%,85% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
      .bandfade { animation: bandfade 5s linear infinite; }
      @keyframes bandfade { 0%,85% { opacity: 1 } 100% { opacity: 0 } }
    ]]></style>
  </defs>
