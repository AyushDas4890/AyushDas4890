      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before { animation: none !important; }
        .smil { display: none; }
        .rm-show { display: inline !important; }
      }
      .link { stroke-dasharray: 1; animation: link 8s cubic-bezier(.16,1,.3,1) infinite backwards; }
      @keyframes link { 0% { stroke-dashoffset: 1; opacity: 1 } 12%,88% { stroke-dashoffset: 0; opacity: 1 } 96%,100% { stroke-dashoffset: 0; opacity: 0 } }
      .clash { animation: clash 8s ease infinite; }
