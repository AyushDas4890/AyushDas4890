      .heat { animation: heat 1.4s ease-in-out infinite; }
      @keyframes heat { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .step { animation: step 8s steps(1) infinite; }
      @keyframes step { 0% { opacity: .35 } 5% { opacity: 1 } 30% { opacity: .35 } }
