<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Ayush Das — AI and Machine Learning Engineer">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#1E40AF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#07070F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="softenSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#60A5FA" opacity="0.10"/>
    </pattern>

    <style><![CDATA[
      .edge {
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 5 11;
        animation: flow 3.6s linear infinite;
      }
      @keyframes flow { to { stroke-dashoffset: -160; } }
      .e-d1 { animation-delay: -.5s }
      .e-d2 { animation-delay: -1.1s }
      .e-d3 { animation-delay: -1.9s }
      .e-d4 { animation-delay: -2.6s }

      .node { animation: breathe 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { 0%,100% { opacity:.55; transform: scale(.9) } 50% { opacity:1; transform: scale(1.12) } }
      .n-d1 { animation-delay: -.7s } .n-d2 { animation-delay: -1.5s }
      .n-d3 { animation-delay: -2.3s } .n-d4 { animation-delay: -3.1s }

      .halo { animation: haloPulse 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes haloPulse { 0%,100% { opacity:.14; transform: scale(.85) } 50% { opacity:.42; transform: scale(1.25) } }

      .ember { animation: drift 9s ease-in-out infinite; }
      @keyframes drift { 0%,100% { opacity:.25; transform: translateY(0) } 50% { opacity:.75; transform: translateY(-11px) } }
      .em-d1 { animation-delay: -2s } .em-d2 { animation-delay: -4.4s } .em-d3 { animation-delay: -6.6s }

      @media (prefers-reduced-motion: reduce) {
        .edge, .node, .halo, .ember { animation: none }
        .node { opacity: .9 }
        .halo { opacity: .26 }
      }
    ]]></style>
  </defs>

  <rect width="1280" height="400" fill="#07070F"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <ellipse cx="640" cy="208" rx="600" ry="215" fill="url(#coreGlow)"/>
  <ellipse cx="196" cy="300" rx="240" ry="180" fill="url(#emberGlow)"/>
  <ellipse cx="1092" cy="112" rx="240" ry="180" fill="url(#emberGlow)"/>

  <!-- graph edges -->
  <g stroke="#60A5FA" opacity="0.5">
    <path class="edge e-d1" d="M120 92 L232 162 L92 232"        stroke-width="1.3"/>
    <path class="edge e-d3" d="M232 162 L200 312 L302 352"      stroke-width="1.3"/>
    <path class="edge e-d2" d="M92 232 L60 152 L120 92"         stroke-width="1"/>
    <path class="edge e-d4" d="M332 70 L232 162"                stroke-width="1"/>
    <path class="edge e-d2" d="M1160 100 L1048 170 L1190 250"   stroke-width="1.3"/>
    <path class="edge e-d4" d="M1048 170 L1080 330 L978 356"    stroke-width="1.3"/>
    <path class="edge e-d1" d="M1190 250 L1232 180 L1160 100"   stroke-width="1"/>
    <path class="edge e-d3" d="M950 62 L1048 170"               stroke-width="1"/>
  </g>
  <g stroke="#F59E0B" opacity="0.42">
    <path class="edge e-d2" d="M332 70 L422 32"      stroke-width="1"/>
    <path class="edge e-d4" d="M302 352 L432 382"    stroke-width="1"/>
    <path class="edge e-d1" d="M950 62 L858 32"      stroke-width="1"/>
    <path class="edge e-d3" d="M978 356 L850 382"    stroke-width="1"/>
  </g>

  <!-- halos -->
  <g fill="#60A5FA">
    <circle class="halo"        cx="120"  cy="92"  r="15"/>
    <circle class="halo n-d2"   cx="92"   cy="232" r="17"/>
    <circle class="halo n-d1"   cx="1190" cy="250" r="17"/>
    <circle class="halo n-d3"   cx="1160" cy="100" r="15"/>
  </g>
  <g fill="#F59E0B">
    <circle class="halo n-d4"   cx="302"  cy="352" r="14"/>
    <circle class="halo n-d2"   cx="978"  cy="356" r="14"/>
  </g>

  <!-- nodes -->
  <g fill="#93C5FD" filter="url(#softenSm)">
    <circle class="node"      cx="120"  cy="92"  r="5"/>
    <circle class="node n-d2" cx="232"  cy="162" r="4"/>
    <circle class="node n-d3" cx="92"   cy="232" r="6"/>
    <circle class="node n-d1" cx="200"  cy="312" r="4"/>
    <circle class="node n-d4" cx="332"  cy="70"  r="4"/>
    <circle class="node n-d2" cx="1160" cy="100" r="5"/>
    <circle class="node n-d4" cx="1048" cy="170" r="4"/>
    <circle class="node n-d1" cx="1190" cy="250" r="6"/>
    <circle class="node n-d3" cx="1080" cy="330" r="4"/>
    <circle class="node n-d2" cx="950"  cy="62"  r="4"/>
  </g>
  <g fill="#FBBF24" filter="url(#softenSm)">
    <circle class="node n-d1" cx="302"  cy="352" r="5"/>
    <circle class="node n-d3" cx="978"  cy="356" r="5"/>
  </g>
  <g fill="#8B8BA7">
    <circle class="node n-d4" cx="60"   cy="152" r="2.6"/>
    <circle class="node n-d2" cx="1232" cy="180" r="2.6"/>
    <circle class="node n-d1" cx="422"  cy="32"  r="2.6"/>
    <circle class="node n-d3" cx="858"  cy="32"  r="2.6"/>
    <circle class="node n-d2" cx="432"  cy="382" r="2.6"/>
    <circle class="node n-d4" cx="850"  cy="382" r="2.6"/>
  </g>

  <!-- drifting embers -->
  <g fill="#F59E0B" filter="url(#soften)">
    <circle class="ember"       cx="470" cy="330" r="2.4" opacity=".5"/>
    <circle class="ember em-d1" cx="812" cy="98"  r="2"   opacity=".5"/>
    <circle class="ember em-d2" cx="392" cy="128" r="1.8" opacity=".5"/>
    <circle class="ember em-d3" cx="900" cy="300" r="2.2" opacity=".5"/>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="640" y="176" fill="#F5F5F7" font-size="82" font-weight="700" letter-spacing="14">AYUSH DAS</text>
    <text x="640" y="230" fill="#93C5FD" font-size="20" font-weight="500" letter-spacing="7.5">AI &amp; MACHINE LEARNING ENGINEER</text>
  </g>
  <rect x="452" y="256" width="376" height="1.6" fill="url(#ruleGrad)"/>
  <text x="640" y="298" text-anchor="middle" fill="#8B8BA7" font-size="16.5" letter-spacing="1.6"
        font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">multi-agent systems · RAG pipelines · shipped, not theorized</text>
</svg>
